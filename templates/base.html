{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock title %}|ViewTrack</title>
  <link rel="stylesheet" href="{% static 'viewtrack/css/style.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- header -->
<header class="header">
  <div class="logo">ViewTrack</div>
  <div class="header-actions">
    <form action="{% url 'accounts:logout' %}" method="post">
      {% csrf_token %}
      <button class="btn ghost">ログアウト</button>
    </form>
  </div>
</header>

<!-- nav -->
<nav class="nav">
  <a class="nav-item {% block nav_home %}{% endblock %}" href="{% url 'index' %}">ホーム</a>
  <a class="nav-item {% block nav_progress %}{% endblock %}" href="{% url 'progress-viewtrack' %}">進捗</a>
  <a class="nav-item {% block nav_favorite %}{% endblock %}" href="#">お気に入り</a>
  <a class="nav-item {% block nav_stats %}{% endblock %}" href="#">統計</a>
</nav>

<!-- main -->
<main class="container">
  {% block content %}
  {% endblock %}
</main>

</body>
</html>
