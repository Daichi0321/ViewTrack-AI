{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Login | ViewTrack</title>
  <link rel="stylesheet" href="{% static 'viewtrack/css/login.css' %}">
</head>
<body>

  <div class="page">
    <h1 class="logo">ViewTrack</h1>
    <p class="subtitle">視聴管理アプリ</p>

    <div class="login-card">
      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <label>ユーザーID</label>
        <input type="text" name="username" placeholder="ユーザーIDを入力">

        <label>パスワード</label>
        <input type="password" name="password" placeholder="パスワードを入力">

        <button type="submit" class="btn login-btn">ログイン</button>
      </form>

      <a href="{% url 'accounts:signup' %}" class="btn register-btn">会員登録</a>
    </div>
  </div>

</body>
</html>
