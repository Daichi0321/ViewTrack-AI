{% extends "base.html" %}
{% block title %}エピソード削除{% endblock %}
{% block content %}
<h2>削除確認</h2>
<p>第{{ object.episode }}話の進捗を削除しますか？</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">削除する</button>
</form>

<a href="{% url 'detail-viewtrack' object.work.pk %}">キャンセル</a>
{% endblock %}
