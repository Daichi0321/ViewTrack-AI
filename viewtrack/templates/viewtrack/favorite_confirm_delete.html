{% extends "base.html" %}
{% block title %}お気に入り削除{% endblock %}
{% block content %}
<h2>削除確認</h2>
<p>{{ object.episode }}のお気に入りを削除しますか？</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">削除</button>
</form>

<a href="{% url 'detail-viewtrack' object.episode.work_id %}">キャンセル</a>
{% endblock %}
