{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup | ViewTrack</title>
  <link rel="stylesheet" href="{% static 'viewtrack/css/login.css' %}">
</head>
<body>
  <main class="page">
    <header>
      <h1 class="logo">ViewTrack</h1>
      <p class="subtitle">視聴管理アプリ</p>
    </header>

    <section class="login-card">
      <form method="post" class="form">
        {% csrf_token %}
        <div class="field">
          <label for="id_username">ユーザーID</label>
          <input id="id_username" type="text" name="username" placeholder="ユーザーIDを入力">
        </div>

        <div class="field">
          <label for="id_password1">パスワード</label>
          <input id="id_password1" type="password" name="password1" placeholder="パスワードを入力">
        </div>

        <div class="field">
          <label for="id_password2">パスワード</label>
          <input id="id_password2" type="password" name="password2" placeholder="パスワードを入力">

          <small class="hint">パスワードは８文字以上で設定してください。</small>

          {% if form.errors %}
              <div class="errors">利用できないユーザー ID やパスワードの可能性があります。入力内容を再度ご確認ください。</div>
          {% endif %}

        </div>
        <button type="submit" class="btn login-btn">アカウント作成</button>
      </form>

      <div class="footer-link">
        <a href="{% url 'accounts:login' %}">ログインはこちら</a>
      </div>
    </section>
  </main>
</body>
</html>
